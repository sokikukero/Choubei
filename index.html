<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>抽背助手</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e5e7eb; --txt:#1f2328; --sub:#6b7280;
  --pri:#2563eb; --pri-d:#1d4ed8; --red:#dc2626; --green:#16a34a; --amber:#d97706; --gray:#9ca3af;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);font-size:16px;line-height:1.5;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:16px}
/* ===== 顶部栏 ===== */
.bar{
  position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:10px 12px;
}
.bar .t{flex:1;font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--sub);flex:0 0 auto;
}
.icon-btn:hover{background:#f0f1f3}
.icon-btn:active{background:#e6e8ec}
.icon-btn svg{width:22px;height:22px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:40px;padding:0 16px;border-radius:10px;font-size:15px;font-weight:500;
  background:var(--pri);color:#fff;transition:background .15s;
}
.btn:active{background:var(--pri-d)}
.btn:disabled{opacity:.4}
.btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
.btn.ghost:active{background:#f0f1f3}
.btn.sm{height:32px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}
/* ===== 内容区 ===== */
.page{padding:12px;padding-bottom:calc(80px + var(--safe))}
.page.tight{padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:8px}
.list-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-bottom:1px solid var(--line);
}
.list-item:last-child{border-bottom:none}
.list-item .body{flex:1;min-width:0}
.list-item .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .meta{font-size:12px;color:var(--sub);margin-top:2px}
.item-detail{padding:10px 12px 4px 36px;font-size:13px;color:var(--txt);animation:detIn .16s ease}
@keyframes detIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.item-detail .kv{margin-bottom:6px;line-height:1.5}
.item-detail .kv>span{color:var(--sub)}
.checkbox{
  width:22px;height:22px;border:2px solid #cbd0d6;border-radius:6px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
}
.checkbox.on{background:var(--pri);border-color:var(--pri)}
.checkbox.on::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.empty{text-align:center;color:var(--sub);padding:48px 20px;font-size:15px}
/* ===== 文件夹网格 ===== */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px}
.folder-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;cursor:pointer;
  min-height:96px;
}
.folder-card:active{background:#f8f9fb}
.folder-card .fn{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-card .fc{font-size:12px;color:var(--sub)}
.folder-actions{position:absolute;top:8px;right:8px;display:flex;gap:2px;opacity:.3}
.folder-card:hover .folder-actions,.folder-card:active .folder-actions{opacity:1}
.folder-actions button{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.folder-actions button:hover{background:#f0f1f3;color:var(--txt)}
.folder-actions svg{width:15px;height:15px}
/* ===== 三块抽背 ===== */
.review{display:flex;flex-direction:column;height:calc(100vh - 60px);padding:0}
.block{
  flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:20px;position:relative;cursor:pointer;user-select:none;
  border-bottom:1px dashed var(--line);
}
.block:last-child{border-bottom:none}
.block .bc{font-size:clamp(20px,6vw,34px);word-break:break-word;white-space:pre-wrap}
.block .bcc{font-size:13px;color:var(--sub);margin-bottom:8px}
.block .placeholder{color:#cbd0d6;font-size:15px}
.block.q{background:#fff}
.block.h{background:#fafbfc}
.block.a{background:#f5f7fa}
.block.revealed{border-left:4px solid var(--pri)}
.block.locked::after{
  content:"点击显示";position:absolute;top:6px;right:10px;font-size:11px;color:var(--gray);
}
.rbar{
  display:flex;gap:10px;padding:12px;background:#fff;border-top:1px solid var(--line);
  padding-bottom:calc(12px + var(--safe));
}
.rbar .btn{flex:1;height:48px;font-size:16px;border-radius:12px}
.rbar .btn.err{background:var(--red)}
.rbar .btn.ok{background:var(--green)}
/* ===== 点数徽标 ===== */
.dot{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 5px;border-radius:11px;font-size:12px;font-weight:600;
  background:var(--gray);color:#fff;flex:0 0 auto;
}
.dot.l1{background:var(--red)}
.dot.l2{background:var(--green)}
.dot.l3{background:var(--amber)}
/* ===== 模态 ===== */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;
  align-items:flex-end;justify-content:center;
}
.mask.show{display:flex}
.modal{
  background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:88vh;
  display:flex;flex-direction:column;animation:up .2s ease;
}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.modal-h .h-title{flex:1;font-weight:600;font-size:16px}
.modal-b{padding:16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;padding-bottom:calc(12px + var(--safe))}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:#fff;color:var(--txt);
}
.field textarea{resize:vertical;min-height:90px;line-height:1.6}
.field .hint-t{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.field .hint-t code{background:#f0f1f3;padding:1px 5px;border-radius:4px;font-family:ui-monospace,Menlo,monospace}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
/* ===== 批量预览 ===== */
.preview-table{width:100%;border-collapse:collapse;font-size:13px}
.preview-table th,.preview-table td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;max-width:180px;overflow:hidden}
.preview-table th{background:#f5f6f8;position:sticky;top:0}
.preview-table tr.bad{background:#fef2f2}
.badge{font-size:11px;padding:1px 6px;border-radius:10px;font-weight:600}
.badge.err{background:#fee2e2;color:var(--red)}
.badge.ok{background:#dcfce7;color:var(--green)}
.toast{
  position:fixed;left:50%;bottom:calc(30px + var(--safe));transform:translateX(-50%);
  background:rgba(31,35,40,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;
  max-width:80vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1}
.batch-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.batch-actions .btn{flex:1;min-width:120px}
.longpress-tip{font-size:12px;color:var(--sub);margin-bottom:8px}
.taginput{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line);border-radius:10px;min-height:42px;align-items:center}
.taginput input{flex:1;border:none;outline:none;min-width:80px;padding:4px}
.chip{background:#eef2ff;color:var(--pri);padding:3px 8px;border-radius:14px;font-size:13px;display:flex;align-items:center;gap:4px}
.chip b{color:var(--gray);cursor:pointer;font-weight:400}
.kv{font-size:13px;color:var(--sub)}
.kv b{color:var(--txt);font-weight:500}
.optbox{display:flex;align-items:center;gap:8px;padding:8px 0}
.optbox input[type=checkbox]{width:18px;height:18px;accent-color:var(--pri)}
.num2{display:flex;gap:8px;align-items:center}
.num2 input{width:80px;text-align:center}
.small{font-size:12px;color:var(--sub)}
.danger{color:var(--red)}
.section-title{padding:16px 14px 6px;font-size:13px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="mask" id="mask"></div>

<script>
"use strict";
/* ============================================================
   抽背助手 —— 单文件离线应用
   数据全部保存在 localStorage，可导出 / 导入
   ============================================================ */
const LS_KEY = 'recall_data_v1';
const $ = (s,r=document)=>r.querySelector(s);
const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
let TOAST_T;

/* ---------- 持久化 ---------- */
function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return seed();
    const d = JSON.parse(raw);
    if(!d.folders || !Array.isArray(d.folders)) return seed();
    return d;
  }catch(e){ console.warn('读取存档失败，使用空数据',e); return seed(); }
}
function seed(){
  return {
    folders:[
      {id:uid(), name:'示例：英语单词', items:[
        mkItem('apple','苹果','水果'),
        mkItem('breakfast','早餐','一日三餐'),
        mkItem('library','图书馆','地点'),
      ]}
    ],
    version:1
  };
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){ toast('保存失败：存储空间可能已满'); } }

let data = loadData();
if(!data.version){ data.version=1; }

function uid(){ return 'i'+Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
function mkItem(q,a,h=''){ return {id:uid(),q,a,h,dot:0,lastCorrect:null}; }
function todayStr(d=new Date()){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function getFolder(id){ return data.folders.find(f=>f.id===id); }
function getFolderOf(itemId){
  for(const f of data.folders){ if(f.items.some(i=>i.id===itemId)) return f; } return null;
}
function dotLevel(d){ if(d<=0) return 0; if(d<=3) return 1; if(d<=7) return 2; return 3; }

/* ---------- 路由 ---------- */
const Route = { page:'home', folderId:null, review:null, previewFolderId:null };
function go(patch){ Object.assign(Route,patch); render(); }

/* ---------- 通用 UI ---------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(TOAST_T); TOAST_T=setTimeout(()=>t.classList.remove('show'),2200);
}
function confirmDlg(title,body,onYes){
  openModal({
    title, bodyHtml: typeof body==='string'? `<p>${esc(body)}</p>`:body,
    actions:[{label:'取消',ghost:true,onClick:closeModal},{label:'确认',danger:true,onClick:()=>{closeModal();onYes();}}]
  });
}
let modalCtx = null;
function openModal({title,bodyHtml,actions}){
  const mask=$('#mask');
  const m=el(`<div class="modal">
    <div class="modal-h"><span class="h-title"></span>
      <button class="icon-btn" id="mclose" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-b"></div>
    <div class="modal-f"></div>
  </div>`);
  $('.h-title',m).textContent=title;
  $('.modal-b',m).innerHTML=bodyHtml;
  const f=$('.modal-f',m);
  actions.forEach(a=>{
    const b=el(`<button class="btn ${a.ghost?'ghost':''} ${a.danger?'red':''}"></button>`);
    b.textContent=a.label; b.onclick=a.onClick; f.appendChild(b);
  });
  mask.innerHTML=''; mask.appendChild(m); mask.classList.add('show');
  $('#mclose').onclick=closeModal;
  modalCtx=m;
}
function closeModal(){ const mask=$('#mask'); mask.classList.remove('show'); mask.innerHTML=''; modalCtx=null; }
function escClose(e){ if(e.key==='Escape') closeModal(); }
document.addEventListener('keydown',escClose);

/* ============================================================
   页面渲染
   ============================================================ */
function render(){
  const app=$('#app'); app.innerHTML='';
  if(Route.page==='home') app.appendChild(homePage());
  else if(Route.page==='folder') app.appendChild(folderPage());
  else if(Route.page==='review') app.appendChild(reviewPage());
  if (Route._restore) {
    const el = document.getElementById(Route._restore);
    if (el) el.scrollIntoView({block:'nearest'});
    delete Route._restore;
  } else if (Route._scrollY) {
    window.scrollTo(0, Route._scrollY);
    delete Route._scrollY;
  }
}

/* ---------- 首页：文件夹列表 ---------- */
function homePage(){
  const root=el('<div></div>');
  root.appendChild(topBar('抽背助手',[
    {icon:exportIcon(),title:'导出数据',onClick:exportData},
    {icon:importIcon(),title:'导入数据',onClick:importData},
  ]));
  const wrap=el('<div class="folder-grid"></div>');
  data.folders.forEach(f=>{
    const total=f.items.length;
    const card=el(`<div class="folder-card" tabindex="0">
      <div class="folder-actions">
        <button title="重命名">${editIcon()}</button>
        <button title="删除">${trashIcon()}</button>
      </div>
      <div class="fn"></div><div class="fc"></div>
    </div>`);
    $('.fn',card).textContent=f.name;
    $('.fc',card).textContent=`${total} 条内容`;
    card.onclick=()=>go({page:'folder',folderId:f.id});
    card.onkeydown=e=>{if(e.key==='Enter')card.click();};
    $('.folder-actions button:first-child',card).onclick=e=>{e.stopPropagation();renameFolder(f);};
    $('.folder-actions button:last-child',card).onclick=e=>{e.stopPropagation();deleteFolder(f);};
    wrap.appendChild(card);
  });
  root.appendChild(wrap);
  const addBtn=el('<div class="page"><button class="btn" style="width:100%">＋ 新建文件夹</button></div>');
  $('button',addBtn).onclick=createFolder;
  root.appendChild(addBtn);
  if(data.folders.length===0){
    root.appendChild(el(`<div class="empty">还没有文件夹，先新建一个吧</div>`));
  }
  return root;
}

/* ---------- 文件夹页 ---------- */
let selMode=false, selSet=new Set();
function folderPage(){
  const f=getFolder(Route.folderId);
  if(!f) return el('<div class="empty">文件夹不存在</div>');
  const root=el('<div></div>');
  root.appendChild(topBar(f.name,[
    {icon:backIcon(),title:'返回',onClick:()=>{selMode=false;selSet.clear();go({page:'home'});}},
  ], selMode ? `${selSet.size} 项已选` : null));

  // 操作条
  const bar=el('<div class="page" style="padding-top:6px"></div>');
  const actions=el('<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div>');
  const bAdd=el('<button class="btn ghost sm" style="flex:1;min-width:88px">＋ 单条添加</button>'); bAdd.onclick=()=>addItem(f);
  const bBatch=el('<button class="btn ghost sm" style="flex:1;min-width:88px">＋ 批量添加</button>'); bBatch.onclick=()=>batchAdd(f);
  const bRev=el('<button class="btn sm" style="flex:1;min-width:88px">▶ 开始抽背</button>'); bRev.onclick=()=>startReview(f);
  actions.append(bAdd,bBatch,bRev);
  bar.appendChild(actions);
  if(selMode){
    const sb=el('<div style="display:flex;gap:8px"></div>');
    const bDel=el('<button class="btn red sm">删除所选</button>');
    bDel.onclick=()=>deleteSelected(f);
    const bCan=el('<button class="btn ghost sm">取消选择</button>');
    bCan.onclick=()=>{selMode=false;selSet.clear();render();};
    sb.append(bDel,bCan); bar.appendChild(sb);
  }
  root.appendChild(bar);
  root.appendChild(el(`<div class="longpress-tip" style="padding:0 12px 6px">点击题目进入编辑，点击右侧数字查看提示与答案；长按条目进入批量选择。</div>`));


  const list=el('<div class="card"></div>');
  if(f.items.length===0){
    list.appendChild(el(`<div class="empty">这个文件夹还是空的，添加一些背诵内容吧</div>`));
  }
  f.items.forEach(it=>{
    const row=el(`<div class="list-item">
      <div class="checkbox"></div>
      <div class="body click-edit">
        <div class="name"></div>
        <div class="meta"></div>
      </div>
      <div class="dot click-reveal"></div>
    </div>`);
    $('.name',row).textContent=it.q || '（空问题）';
    $('.meta',row).textContent=it.lastCorrect? `上次复习：${it.lastCorrect}` : '尚未复习过';
    $('.dot',row).textContent=it.dot;
    $('.dot',row).className='dot click-reveal '+['','l1','l2','l3'][dotLevel(it.dot)];
    const cb=$('.checkbox',row);
    if(selMode){ cb.classList.toggle('on',selSet.has(it.id)); }
    // 展开/收起详情（仅正常模式下）
    if(!selMode && it._open){
      const det=el(`<div class="item-detail" id="it-${it.id}">
        ${it.h?`<div class="kv"><b>提示：</b><span></span></div>`:''}
        <div class="kv"><b>答案：</b><span></span></div>
        <div class="kv"><b>正确次数：</b><span>${it.dot}</span></div>
      </div>`);
      if(it.h){$('.item-detail .kv:first-child span',det).textContent=it.h;}
      $('.item-detail .kv:last-child span',det).textContent=it.dot;
      $('.item-detail .kv:nth-of-type(2) span',det).textContent=it.a;
      row.appendChild(det);
    }
    // 长按
    let timer=null, fired=false;
    const start=()=>{fired=false;timer=setTimeout(()=>{fired=true;enterSel(it.id);},520);};
    const cancel=()=>{clearTimeout(timer);};
    row.addEventListener('mousedown',start); row.addEventListener('touchstart',start,{passive:true});
    row.addEventListener('mouseup',cancel); row.addEventListener('mouseleave',cancel); row.addEventListener('touchend',cancel);
    row.addEventListener('touchmove',cancel,{passive:true});
    // 题目区点击 → 编辑
    $('.click-edit',row).onclick=e=>{e.stopPropagation();if(selMode||fired)return;editItem(f,it);};
    // 数字区点击 → 展开/收起提示与答案（同时只展开一条，不跳动页面）
    $('.click-reveal',row).onclick=e=>{
      e.stopPropagation(); if(selMode||fired) return;
      const y=window.scrollY;
      if (it._open) { it._open=false; }
      else {
        f.items.forEach(o=>{ if(o!==it) delete o._open; });
        it._open=true;
        Route._restore='it-'+it.id;
      }
      Route._scrollY=y;
      render();
    };
    // 行点击：数字区优先，其余走题目区
    row.onclick=()=>{
      if(selMode){ if(selSet.has(it.id))selSet.delete(it.id); else selSet.add(it.id);
        if(selSet.size===0){selMode=false;}
        render(); return;
      }
      if(fired) return;
      editItem(f,it);
    };
    list.appendChild(row);
  });
  root.appendChild(list);
  return root;
}
function enterSel(id){
  selMode=true; selSet.add(id); render();
  toast('已进入批量选择模式（点击条目增减选择）');
}
function deleteSelected(f){
  if(selSet.size===0){selMode=false;render();return;}
  confirmDlg('删除所选内容',`确定删除选中的 ${selSet.size} 条内容吗？此操作不可撤销。`,()=>{
    f.items=f.items.filter(i=>!selSet.has(i.id));
    selSet.clear();selMode=false;save();render();toast('已删除');
  });
}

/* ---------- 抽背页 ---------- */
function startReview(folder){
  const f=getFolder(folder.id);
  if(!f||f.items.length===0){toast('文件夹为空，无法抽背');return;}
  openModal({
    title:'抽背设置',
    bodyHtml: reviewSetupHtml(f),
    actions:[{label:'取消',ghost:true,onClick:closeModal},{label:'开始抽背',onClick:()=>doStart(f)}]
  });
  bindSetup(f);
}
function reviewSetupHtml(f){
  return `
  <div class="field">
    <label>抽背数量</label>
    <input type="number" id="st_count" min="1" value="${f.items.length}">
    <div class="hint-t">文件夹共 <b>${f.items.length}</b> 条，可填更大数值以循环覆盖。</div>
  </div>
  <div class="field">
    <label>顺序</label>
    <select id="st_order">
      <option value="seq">正序</option>
      <option value="rand">乱序</option>
    </select>
  </div>
  <div class="field">
    <label class="optbox"><input type="checkbox" id="st_rev"> 反转题目和答案（中外↔外中）</label>
  </div>
  <div class="field">
    <label class="optbox"><input type="checkbox" id="st_limit"> 限定熟练度（正确次数范围）</label>
    <div class="num2" style="margin-top:6px">
      <input type="number" id="st_min" value="0" min="0"><span>至</span>
      <input type="number" id="st_max" value="999" min="0">
    </div>
  </div>`;
}
function bindSetup(f){
  const cnt=$('#st_count'), min=$('#st_min'),max=$('#st_max');
  // 熟练度范围只在勾选时启用
  const lim=$('#st_limit');
  const toggle=()=>{min.disabled=max.disabled=!lim.checked;};
  lim.onchange=toggle; toggle();
}
function doStart(f){
  const cfg={count:1,order:'seq',reverse:false,limit:false,min:0,max:0};
  cfg.count=Math.max(1,parseInt($('#st_count').value||'1')||1);
  cfg.order=$('#st_order').value;
  cfg.reverse=$('#st_rev').checked;
  cfg.limit=$('#st_limit').checked;
  cfg.min=Math.max(0,parseInt($('#st_min').value||'0')||0);
  cfg.max=Math.max(cfg.min,parseInt($('#st_max').value||'0')||0);
  let pool=f.items.filter(i=>!cfg.limit || (i.dot>=cfg.min && i.dot<=cfg.max));
  if(pool.length===0){toast('当前条件下没有可选内容');return;}
  let queue=[];
  if(cfg.order==='rand' && cfg.count<pool.length){
    // 随机抽取不重复，数量不足则复用全部
    const idx=[...pool.keys()]; shuffle(idx);
    queue=idx.slice(0,cfg.count).map(i=>pool[i]);
  }else{
    queue=cfg.count<=pool.length ? pool.slice() : (function(){
      const q=[]; const idx=[...pool.keys()]; shuffle(idx);
      while(q.length<cfg.count){ shuffle(idx); for(const i of idx){ q.push(pool[i]); if(q.length>=cfg.count)break; } }
      return q;
    })();
    if(cfg.order==='rand') shuffle(queue);
  }
  Route.review={
    folderId:f.id,name:f.name,queue,idx:0,reverse:cfg.reverse,
    wrong:[],done:false,reviewingWrong:false
  };
  closeModal();
  go({page:'review'});
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;}

function reviewPage(){
  const st=Route.review;
  if(!st) return el('<div class="empty">会话已结束</div>');
  const f=getFolder(st.folderId);
  const it=st.queue[st.idx];
  const root=el('<div class="review"></div>');
  // 顶部栏：进度
  const bar=topBarSimple(`
    <span class="kv"><b>${st.idx+1}</b>/${st.queue.length}</span>
    ${st.reverse?'<span class="badge ok">反转</span>':''}
    ${st.reviewingWrong?'<span class="badge err">错题回顾</span>':''}
  `,[{icon:closeXIcon(),title:'退出',onClick:()=>{
    confirmDlg('退出抽背','确定要结束本次抽背吗？',()=>{Route.review=null;go({page:'folder',folderId:st.folderId});});
  }}]);
  root.appendChild(bar);
  if(!it){ root.appendChild(el('<div class="empty">本次抽背已完成！</div>')); return root; }
  const showQ=st.reverse? it.a : it.q;
  const showH=st.reverse? it.h : it.h;
  const showA=st.reverse? it.q : it.a;
  root.appendChild(makeBlock('q','题目',showQ,true));
  root.appendChild(makeBlock('h','提示',showH||'（无提示）',st.revH));
  root.appendChild(makeBlock('a','答案',showA,st.revA));
  function makeBlock(kind,label,txt,revealed){
    const key='rev'+kind.toUpperCase()[0]+kind.slice(1);
    const b=el(`<div class="block ${kind} ${revealed?'revealed':'locked'}"></div>`);
    if(!revealed){
      b.innerHTML=`<div><div class="placeholder">点击显示${label}</div></div>`;
      b.onclick=()=>{ st[key]=true; render(); };
    }else{
      b.innerHTML=`<div><div class="bcc">${label}</div><div class="bc"></div></div>`;
      $('.bc',b).textContent=txt;
    }
    return b;
  }
  // 判定按钮
  const rb=el('<div class="rbar"></div>');
  const err=el('<button class="btn err">✗ 错误</button>');
  const ok=el('<button class="btn ok">✓ 正确</button>');
  err.onclick=()=>mark(false); ok.onclick=()=>mark(true);
  rb.append(err,ok); root.appendChild(rb);
  return root;

  function mark(correct){
    const st2=Route.review;
    const it2=st2.queue[st2.idx];
    if(correct){
      award(it2);
      toast('标记正确 +1');
    }else{
      if(!st2.wrong.includes(it2.id)) st2.wrong.push(it2.id);
      toast('已加入错题');
    }
    // 进入下一条
    st2.idx++;
    st2.revQ=st2.revH=st2.revA=false;
    if(st2.idx>=st2.queue.length){ finishRound(); }
    save(); render();
  }
}
function award(it){
  const t=todayStr();
  if(it.lastCorrect!==t){ it.dot++; it.lastCorrect=t; }
}
function finishRound(){
  const st=Route.review;
  st.done=true;
  save();
  // 收集错题对象
  const f=getFolder(st.folderId);
  const wrongItems=st.wrong.map(id=>f.items.find(i=>i.id===id)).filter(Boolean);
  if(wrongItems.length===0){
    openModal({
      title:'本轮完成 🎉',
      bodyHtml:`<p>全部答对！这一轮没有错题。</p>`,
      actions:[{label:'返回',onClick:()=>{closeModal();Route.review=null;go({page:'folder',folderId:st.folderId});}}]
    });
    return;
  }
  // 错题回顾选项
  openModal({
    title:`本轮完成（${wrongItems.length} 题答错）`,
    bodyHtml:`<p>是否进入错题回顾？答错的题目将重新抽背，直到全部答对为止。</p>
      <div class="section-title">错题列表</div>
      <div class="card" id="wrong_list"></div>`,
    actions:[
      {label:'跳过',ghost:true,onClick:()=>{closeModal();Route.review=null;go({page:'folder',folderId:st.folderId});}},
      {label:'开始回顾错题',onClick:()=>{closeModal();startWrongReview(wrongItems);}}
    ]
  });
  const wl=$('#wrong_list');
  wrongItems.forEach(i=>{
    const r=el('<div class="list-item"><div class="body"><div class="name"></div></div></div>');
    $('.name',r).textContent= i.q;
    wl.appendChild(r);
  });
}
function startWrongReview(items){
  const st=Route.review;
  // 打乱
  const q=items.slice(); shuffle(q);
  st.queue=q; st.idx=0; st.wrong=[]; st.reviewingWrong=true;
  st.revQ=st.revH=st.revA=false;
  render();
}

function batchAdd(f){
  openModal({
    title:'批量添加',
    bodyHtml:`
    <div class="field"><label>自定义格式</label>
      <input type="text" id="bf_fmt" value="[问题]/[答案]/[提示]">
      <div class="hint-t">用 <code>/</code>（半角斜线）分隔各要素，用半角中括号 <code>[</code> <code>]</code> 标示要素位置。提示可选：例如 <code>[问题]/[答案]</code> 表示每行两条。</div>
    </div>
    <div class="field"><label>待解析文本（每行一条）</label>
      <textarea id="bf_txt" rows="8" placeholder="苹果/[apple]/fruit
早餐/[breakfast]"></textarea>
    </div>
    <div class="field"><label class="optbox"><input type="checkbox" id="bf_skip" checked> 解析失败时跳过该行（不勾选则整批取消）</label></div>`,
    actions:[
      {label:'取消',ghost:true,onClick:closeModal},
      {label:'解析并预览',onClick:()=>parseBatch(f)},
    ]
  });
}
function parseBatch(f){
  const fmt=$('#bf_fmt').value;
  const txt=$('#bf_txt').value;
  const skip=$('#bf_skip').checked;
  // 构建正则：把 [问题] [答案] [提示] 替换为捕获组，分隔符 / 转义
  const esc=(c)=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  // 槽位顺序
  const order=[];
  const slots=[...fmt.matchAll(/\[问题\]|\[答案\]|\[提示\]/g)].map(m=>m[0]);
  slots.forEach(sl=>order.push(sl==='[问题]'?'q':sl==='[答案]'?'a':'h'));
  if(order.length===0){ toast('格式中至少需要包含 [问题] 与 [答案]'); return; }
  if(!order.includes('q')||!order.includes('a')){ toast('格式中必须包含 [问题] 与 [答案]'); return; }
  // 按槽位切分格式，得到槽位之间的分隔符片段（已转义）
  // 容错解析：以“分隔符片段”切分整行，再按槽位顺序映射（提示段允许缺失）
  const esc2=(c)=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const delimTokens=fmt.split(/\[问题\]|\[答案\]|\[提示\]/).map(s=>[...s].map(esc2).join(''));
  const splitRe=new RegExp(delimTokens.filter(t=>t.length).map(t=>t.replace(/\\\//g,'\\/')).join('|')||'(?!x)x');
  const parts=txt.split(/\r?\n/);
  const rows=[];
  const errors=[];
  for(let i=0;i<parts.length;i++){
    const line=parts[i].trim();
    if(!line) continue;
    let segs=line.split(splitRe).map(s=>s.trim());
    // 去除首尾空段
    while(segs.length&&segs[0]==='') segs.shift();
    while(segs.length&&segs[segs.length-1]==='') segs.pop();
    if(segs.length<order.length){ errors.push({n:i+1,line,reason:`需要 ${order.length} 段，实际得到 ${segs.length} 段`}); continue; }
    // 内容中含分隔符时，多出的段拼回末槽位
    const obj={q:'',a:'',h:''};
    if(segs.length>order.length){
      const glue=(delimTokens.find(t=>t.length)||'/').replace(/\\(.)/g,'$1');
      obj[order[order.length-1]]=segs.slice(order.length-1).join(glue).trim();
      for(let k=0;k<order.length-1;k++) obj[order[k]]=segs[k];
    }else{
      segs.forEach((seg,idx)=>{ obj[order[idx]]=seg; });
    }
    if(!obj.q||!obj.a){ errors.push({n:i+1,line,reason:'问题或答案为空'}); continue; }
    rows.push(obj);
  }
  // 渲染预览
  const body=el('<div></div>');
  if(rows.length){
    const t=el('<table class="preview-table"><thead><tr><th>#</th><th>问题</th><th>答案</th><th>提示</th></tr></thead><tbody></tbody></table>');
    rows.forEach((r,idx)=>{
      const tr=el('<tr></tr>');
      tr.innerHTML=`<td>${idx+1}</td><td></td><td></td><td>${esc(r.h)||'<span class="small">无</span>'}</td>`;
      tr.children[1].textContent=r.q; tr.children[2].textContent=r.a;
      $('tbody',t).appendChild(tr);
    });
    body.appendChild(el(`<p class="kv">成功解析 <b>${rows.length}</b> 条，预览如下：</p>`));
    body.appendChild(t);
  }
  if(errors.length){
    const et=el('<table class="preview-table" style="margin-top:12px"><thead><tr><th>行号</th><th>内容</th><th>原因</th></tr></thead><tbody></tbody></table>');
    errors.forEach(e=>{
      const tr=el('<tr class="bad"></tr>');
      tr.innerHTML=`<td>${e.n}</td><td></td><td>${esc(e.reason)}</td>`;
      tr.children[1].textContent=e.line.slice(0,40);
      $('tbody',et).appendChild(tr);
    });
    body.appendChild(el(`<p class="kv" style="color:var(--red);margin-top:12px">有 <b>${errors.length}</b> 行不符合格式：</p>`));
    body.appendChild(et);
  }
  openModal({
    title:'批量添加 · 预览',
    bodyHtml:'',
    actions:[
      {label:'返回修改',ghost:true,onClick:()=>batchAdd(f)},
      {label:`确认添加 ${rows.length} 条`,onClick:()=>{
        if(rows.length===0){ toast('没有可添加的内容'); return; }
        if(errors.length&&!skip){ toast('存在不符合格式的行，请先修正'); return; }
        rows.forEach(r=>f.items.push(mkItem(r.q,r.a,r.h)));
        save();render();closeModal();toast(`已添加 ${rows.length} 条`);
      }},
    ]
  });
  $('.modal-b',modalCtx).appendChild(body);
}

function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=el('<a></a>'); a.href=url; a.download='抽背助手数据_'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('已导出数据文件');
}
function importData(){
  const inp=el('<input type="file" accept="application/json,.json" style="display:none">');
  document.body.appendChild(inp);
  inp.onchange=()=>{
    const file=inp.files[0]; document.body.removeChild(inp);
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const d=JSON.parse(reader.result);
        if(!d||!Array.isArray(d.folders)) throw new Error('格式错误');
        confirmDlg('导入数据','导入会用文件内容替换当前所有数据，是否继续？',()=>{
          data=d; if(!data.version)data.version=1;
          save(); Route.page='home'; render(); toast('导入成功');
        });
      }catch(e){ toast('文件格式不正确：'+e.message); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function topBarSimple(left,icons){
  const b=el('<div class="bar"></div>');
  const l=el('<div class="t" style="display:flex;align-items:center;gap:8px"></div>');
  l.innerHTML=left; b.appendChild(l);
  (icons||[]).forEach(i=>{
    const btn=el('<button class="icon-btn" title="'+esc(i.title||'')+'"></button>');
    btn.innerHTML=i.icon; btn.onclick=i.onClick; b.appendChild(btn);
  });
  return b;
}

/* ---------- 启动 ---------- */
render();
