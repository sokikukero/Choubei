<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>抽背</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#222}
button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:11px 15px;background:#222;color:white;cursor:pointer}button.secondary{background:#e7e7ea;color:#222}button.danger{background:#d33}button.good{background:#25864a}button.warn{background:#b77900}
.app{max-width:720px;margin:auto;min-height:100vh;background:#fff}.top{padding:18px 18px 10px;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:22px;margin:0}.view{padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.folders{display:grid;gap:10px}.folder{padding:15px;border:1px solid #ddd;border-radius:14px;display:flex;justify-content:space-between;align-items:center}.folder strong{font-size:16px}.muted{color:#888;font-size:13px}.card{border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:12px}.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-weight:600;font-size:14px}input,textarea,select{width:100%;border:1px solid #ccc;border-radius:10px;padding:11px;background:#fff}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{padding:13px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:12px}.count{font-weight:700;min-width:30px;text-align:right}.c0{color:#999}.c1{color:#d33}.c2{color:#25864a}.c3{color:#c58a00}.hint{background:#fff6d9;border-radius:12px;padding:13px;margin:12px 0}.answer{background:#eef8f0;border-radius:12px;padding:13px;margin:12px 0}.study{min-height:calc(100vh - 64px);display:grid;grid-template-rows:1fr auto 1fr auto;gap:10px;padding:16px}.studybox{border:1px solid #ddd;border-radius:16px;padding:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;white-space:pre-wrap;overflow:auto}.studyhint{min-height:55px;font-size:16px}.studyanswer{min-height:120px;font-size:20px}.studybuttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.progress{text-align:center;color:#777;font-size:13px}.empty{text-align:center;color:#888;padding:40px 10px}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modalbox{background:white;width:min(720px,100%);padding:20px;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto}.close{float:right;background:#eee;color:#222}.redx{color:#d33;font-size:22px}.fileinput{display:none}.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}.switch span{font-size:14px}.switch input{width:auto}.rangebox{display:none;gap:8px;align-items:center;margin-top:8px}.rangebox.show{display:flex}.rangebox input{width:auto;flex:1;min-width:0}.item.selectable{transition:background .15s}.item.selectable.sel{background:#fff3cd}.item.selectable.sel .itemtick{background:#25864a;color:#fff}.itemtick{width:24px;height:24px;border-radius:50%;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}.batchbar{position:sticky;top:64px;z-index:6;background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px;margin-bottom:12px;display:none;align-items:center;justify-content:space-between;gap:8px}.batchbar.show{display:flex}.hintbox{display:none}.hintbox.show{display:block}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY="choubei_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"folders":[]}');
let state={view:"home",folderId:null,editing:null,study:null,selectMode:false,selected:[]};

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function folder(){return db.folders.find(x=>x.id===state.folderId)}
function countClass(n){return n===0?"c0":n<=3?"c1":n<=7?"c2":"c3"}

function header(title,back=true){
 return `<div class="top">${back?'<button class="secondary" onclick="goHome()">‹ 返回</button>':''}<h1>${esc(title)}</h1><span></span></div>`
}
function render(){
 const a=document.getElementById("app");
 if(state.view==="home") a.innerHTML=header("抽背",false)+home();
 if(state.view==="folder") a.innerHTML=header(folder()?.name||"文件夹")+folderView();
 if(state.view==="browse") a.innerHTML=header("浏览")+browse();
 if(state.view==="edit") a.innerHTML=header(state.editing?.id?"编辑内容":"添加内容")+editView();
 if(state.view==="study") a.innerHTML=studyView();
}
function goHome(){state={view:"home",folderId:null,editing:null,study:null,selectMode:false,selected:[]};render()}
function home(){
 return `<div class="view"><div class="toolbar"><button onclick="newFolder()">＋ 新建文件夹</button><button class="secondary" onclick="importAll()">导入备份</button><button class="secondary" onclick="exportAll()">导出备份</button></div>
 <div class="folders">${db.folders.length?db.folders.map(f=>`<div class="folder"><div onclick="openFolder('${f.id}')" style="flex:1"><strong>${esc(f.name)}</strong><div class="muted">${f.items.length} 条内容</div></div><div class="actions"><button class="secondary" onclick="renameFolder('${f.id}')">重命名</button><button class="danger" onclick="deleteFolder('${f.id}')">删除</button></div></div>`).join(""):'<div class="empty">还没有文件夹。<br>先创建一个吧。</div>'}</div>
 <input id="importfile" class="fileinput" type="file" accept=".json" onchange="doImport(event)">
 </div>`
}
function openFolder(id){state.view="folder";state.folderId=id;state.selectMode=false;state.selected=[];render()}
function folderView(){
 const f=folder(); if(!f)return "";
 return `<div class="view"><div class="toolbar">
 <button onclick="newItem()">＋ 添加</button><button class="secondary" onclick="batch()">批量添加</button>
 <button class="secondary" onclick="browse()">浏览</button><button class="good" onclick="startStudy()">开始抽背</button>
 </div>
 <div class="batchbar ${state.selectMode?'show':''}" id="batchbar">
 <span class="muted">已选 <b id="selcount">0</b> 条</span>
 <div class="actions">
 <button class="secondary" onclick="selectAll()">全选</button>
 <button class="danger" onclick="batchDelete()">删除选中</button>
 <button class="secondary" onclick="exitSelect()">取消</button>
 </div>
 </div>
 <div class="muted" style="margin-bottom:12px">${f.items.length} 条内容<span class="hintbox ${state.selectMode?'show':''}" style="margin-left:8px;color:#b77900">· 长按条目可批量选择</span></div>
 ${f.items.length?f.items.map((it,i)=>`<div class="item ${state.selectMode?'selectable':''} ${state.selected&&state.selected.includes(it.id)?'sel':''}" ${state.selectMode?`onclick="toggleSelect('${it.id}')"`:`onclick="preview('${it.id}')"`} ${!state.selectMode?`oncontextmenu="longPress(event,'${it.id}')" ontouchstart="touchStart(event,'${it.id}')" ontouchend="touchEnd()" ontouchmove="touchMove()"` :''}>
 ${state.selectMode?`<span class="itemtick">${state.selected&&state.selected.includes(it.id)?'✓':''}</span>`:''}
 <div style="flex:1">${esc(it.question)}</div><div class="actions"><span class="count ${countClass(it.correctCount)}">${it.correctCount}</span>${!state.selectMode?`<button class="secondary" onclick="event.stopPropagation();editItem('${it.id}')">编辑</button>`:''}</div></div>`).join(""):'<div class="empty">这个文件夹还没有内容。</div>'}</div>`
}
function browse(){state.view="browse";render()}
function browse(){
 const f=folder();
 return `<div class="view"><div class="toolbar"><button class="secondary" onclick="openFolder('${f.id}')">返回列表</button></div>
 ${f.items.length?f.items.map(it=>`<div class="item" onclick="preview('${it.id}')"><div style="flex:1">${esc(it.question)}</div><div class="count ${countClass(it.correctCount)}">${it.correctCount}</div></div>`).join(""):'<div class="empty">没有内容。</div>'}</div>`
}
function newFolder(){
 const name=prompt("文件夹名称"); if(!name?.trim())return;
 db.folders.push({id:uid(),name:name.trim(),items:[],createdAt:Date.now()});save();render()
}
function renameFolder(id){
 const f=db.folders.find(x=>x.id===id), name=prompt("新名称",f.name);
 if(name?.trim()){f.name=name.trim();save();render()}
}
function deleteFolder(id){
 const f=db.folders.find(x=>x.id===id);
 if(confirm(`确定删除“${f.name}”及其中全部内容吗？`)){db.folders=db.folders.filter(x=>x.id!==id);save();render()}
}
let _touchTimer=null,_touchId=null,_touchMoved=false;
function touchStart(e,id){_touchMoved=false;_touchId=id;_touchTimer=setTimeout(()=>{_touchTimer=null;enterSelect(id)},550)}
function touchEnd(){if(_touchTimer){clearTimeout(_touchTimer);_touchTimer=null}}
function touchMove(){if(_touchTimer){clearTimeout(_touchTimer);_touchTimer=null}}
function longPress(e,id){e.preventDefault();enterSelect(id)}
function enterSelect(id){
 if(state.selectMode)return;
 state.selectMode=true;state.selected=[id];render()
}
function toggleSelect(id){
 if(!state.selectMode)return;
 if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);
 else state.selected.push(id);
 document.getElementById("selcount").textContent=state.selected.length;
 if(state.selected.length===0)exitSelect(); else render()
}
function selectAll(){
 const f=folder();state.selected=f.items.map(x=>x.id);render()
}
function exitSelect(){state.selectMode=false;state.selected=[];render()}
function batchDelete(){
 if(!state.selected.length)return;
 if(confirm(`确定删除选中的 ${state.selected.length} 条内容吗？`)){
   const f=folder();f.items=f.items.filter(x=>!state.selected.includes(x.id));save();
   state.selectMode=false;state.selected=[];render()
 }
}
function editView(){
 const x=state.editing||{question:"",answer:"",hint:""};
 return `<div class="view"><div class="card">
 <div class="field"><label>问题 *</label><textarea id="q">${esc(x.question)}</textarea></div>
 <div class="field"><label>答案 *</label><textarea id="a">${esc(x.answer)}</textarea></div>
 <div class="field"><label>提示（可选）</label><textarea id="h">${esc(x.hint)}</textarea></div>
 <div class="actions"><button onclick="saveItem()">保存</button>${x.id?'<button class="danger" onclick="deleteItem()">删除</button>':''}<button class="secondary" onclick="openFolder(\''+folder().id+'\')">取消</button></div>
 </div></div>`
}
function newItem(){state.view="edit";state.editing=null;render()}
function editItem(id){state.view="edit";state.editing=folder().items.find(x=>x.id===id);render()}
function saveItem(){
 const q=document.getElementById("q").value.trim(),a=document.getElementById("a").value.trim(),h=document.getElementById("h").value.trim();
 if(!q||!a)return alert("问题和答案不能为空。");
 const f=folder();
 if(state.editing){Object.assign(state.editing,{question:q,answer:a,hint:h,updatedAt:Date.now()})}
 else f.items.push({id:uid(),question:q,answer:a,hint:h,correctCount:0,lastCorrectDate:null,createdAt:Date.now(),updatedAt:Date.now()});
 save();openFolder(f.id)
}
function deleteItem(){
 if(confirm("确定删除这条内容吗？")){const f=folder();f.items=f.items.filter(x=>x.id!==state.editing.id);save();openFolder(f.id)}
}
function preview(id){
 const it=folder().items.find(x=>x.id===id);
 showModal(`<button class="close" onclick="closeModal()">关闭</button><h2>${esc(it.question)}</h2><div class="hint"><b>提示</b><br>${it.hint?esc(it.hint):'<span class="muted">无提示</span>'}</div><div class="answer"><b>答案</b><br>${esc(it.answer)}</div><div class="muted">累计正确次数：${it.correctCount}</div><div class="muted" style="margin-top:14px;text-align:center">点击任意位置关闭</div>`,true)
}
function showModal(body,clickToClose){
 const d=document.createElement("div");d.className="modal";d.id="modal";d.innerHTML='<div class="modalbox">'+body+'</div>';
 if(clickToClose)d.onclick=closeModal;
 document.body.appendChild(d)
}
function closeModal(){document.getElementById("modal")?.remove()}
function batch(){
 showModal(`<button class="close" onclick="closeModal()">关闭</button><h2>批量添加</h2>
 <p class="muted">先定义每行的格式。例如：<b>[题目]/[答案]/[提示]</b> 表示使用“/”分隔三个要素。</p>
 <div class="field"><label>导入格式</label>
 <input id="formattext" value="[题目]/[答案]/[提示]" placeholder="[题目]/[答案]/[提示]">
 </div>
 <div class="field"><label>要导入的文本</label>
 <textarea id="batchtext" style="min-height:190px" placeholder="问题1/答案1/提示1\n问题2/答案2/\n问题3/答案3/提示3"></textarea></div>
 <div id="formatmsg" class="muted" style="margin-bottom:10px"></div>
 <div class="actions"><button onclick="parseBatch()">预览</button></div>`)
}
function parseFormat(fmt){
 const re=/\[(题目|问题|答案|提示)\]/g;
 let fields=[],parts=[],last=0,m;
 while((m=re.exec(fmt))){
   if(m.index>last)parts.push({type:"sep",value:fmt.slice(last,m.index)});
   fields.push(m[1]==="问题"?"题目":m[1]);
   parts.push({type:"field",value:fields[fields.length-1]});
   last=re.lastIndex;
 }
 if(last<fmt.length)parts.push({type:"sep",value:fmt.slice(last)});
 if(!fields.includes("题目")||!fields.includes("答案"))return {error:"格式至少需要包含 [题目] 和 [答案]。"};
 if(new Set(fields).size!==fields.length)return {error:"同一个要素不能重复。"};
 const seps=parts.filter(x=>x.type==="sep").map(x=>x.value).filter(Boolean);
 if(seps.length===0)return {error:"各要素之间没有分隔符，无法可靠判断题目、答案和提示的边界。请在要素之间加入分隔符，例如：[题目]/[答案]/[提示]。"};
 if(seps.some(x=>x.includes("[")||x.includes("]")))return {error:"分隔符中不能包含方括号。"};
 return {parts,fields,seps};
}
function parseLine(line,info){
 let pattern="^", groups=[];
 for(const p of info.parts){
   if(p.type==="field"){
     groups.push(p.value);
     pattern+="(.*?)";
   }else{
     pattern+=escapeRegExp(p.value);
   }
 }
 pattern+="$";
 const m=line.match(new RegExp(pattern));
 if(!m)return null;
 const vals={题目:"",答案:"",提示:""};
 groups.forEach((g,i)=>vals[g]=m[i+1]||"");
 return vals;
}
function escapeRegExp(x){return x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function parseBatch(){
 const fmt=document.getElementById("formattext").value.trim();
 const info=parseFormat(fmt);
 const msg=document.getElementById("formatmsg");
 if(info.error){msg.innerHTML='<span style="color:#d33">'+esc(info.error)+'</span>';return}
 const lines=document.getElementById("batchtext").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!lines.length){msg.textContent="请先输入要导入的文本。";return}
 const rows=lines.map(line=>parseLine(line,info));
 const bad=rows.map((r,i)=>r?null:i+1).filter(Boolean);
 if(bad.length){
   msg.innerHTML='<span style="color:#d33">第 '+bad.join("、")+' 行无法按照当前格式解析，请检查分隔符或内容。</span>';
   return;
 }
 const preview=rows.map((r,i)=>`<div class="card"><b>${i+1}. ${esc(r.题目)}</b><div class="muted" style="margin-top:6px">答案：${esc(r.答案)}${r.提示?`　提示：${esc(r.提示)}`:""}</div></div>`).join("");
 msg.innerHTML='<b style="color:#25864a">解析成功，共 '+rows.length+' 条。</b>';
 const box=document.querySelector("#modal .modalbox");
 box.innerHTML=`<button class="close" onclick="closeModal()">关闭</button><h2>导入预览</h2><p class="muted">格式：${esc(fmt)}</p>${preview}<div class="actions"><button onclick='confirmBatchImport(${JSON.stringify(rows)})'>确认添加 ${rows.length} 条</button><button class="secondary" onclick="batch()">返回修改</button></div>`;
}
function confirmBatchImport(rows){
 const f=folder();
 rows.forEach(r=>f.items.push({id:uid(),question:r.题目.trim(),answer:r.答案.trim(),hint:r.提示.trim(),correctCount:0,lastCorrectDate:null,createdAt:Date.now(),updatedAt:Date.now()}));
 save();closeModal();render()
}

function startStudy(){
 const f=folder(); if(!f.items.length)return alert("这个文件夹没有内容。");
 const haveCounts=f.items.some(x=>x.correctCount>0);
 showModal(`<button class="close" onclick="closeModal()">关闭</button><h2>开始抽背</h2>
 <div class="field"><label>数量</label><input id="num" type="number" min="1" max="${f.items.length}" value="${Math.min(10,f.items.length)}"></div>
 <div class="field"><label>顺序</label><select id="order"><option value="shuffle">乱序</option><option value="normal">正序</option></select></div>
 <div class="switch"><span>题目与答案反转</span><input id="reverse" type="checkbox"></div>
 <div class="switch"><span>限定熟练度</span><input id="limit" type="checkbox" onchange="document.getElementById('rangebox').classList.toggle('show',this.checked)"></div>
 <div class="rangebox ${haveCounts?'':'show'}" id="rangebox"><input id="minc" type="number" min="0" value="0" placeholder="最小"><span>~</span><input id="maxc" type="number" min="0" value="9999" placeholder="最大"></div>
 ${haveCounts?'':'<div class="muted" style="font-size:12px">当前没有记录过正确次数的内容，限定熟练度将匹配全部。</div>'}
 <button onclick="beginStudy()">开始</button>`)
}
function beginStudy(){
 const f=folder(),n=Math.max(1,Math.min(f.items.length,parseInt(document.getElementById("num").value)||1));
 let pool=[...f.items];
 if(document.getElementById("limit").checked){
   const minc=parseInt(document.getElementById("minc").value)||0;
   const maxc=parseInt(document.getElementById("maxc").value)||0;
   pool=pool.filter(x=>x.correctCount>=Math.min(minc,maxc)&&x.correctCount<=Math.max(minc,maxc));
   if(!pool.length)return alert("没有符合该熟练度范围的内容。");
 }
 const reverse=document.getElementById("reverse").checked;
 let arr=pool;
 if(document.getElementById("order").value==="shuffle")arr.sort(()=>Math.random()-.5);
 arr=arr.slice(0,Math.min(n,arr.length));
 state.view="study";state.study={queue:arr,index:0,phase:"q",wrong:[],review:false,reverse};closeModal();render()
}
function studyView(){
 const s=state.study,it=s.queue[s.index];
 if(!it)return finishStudy();
 const q=s.reverse?it.answer:it.question;
 const a=s.reverse?it.question:it.answer;
 const showHint=s.phase==="h"||s.phase==="a";
 const showAns=s.phase==="a";
 return `<div class="study">${header(s.review?"错误回顾":"抽背",false)}
 <div class="studybox">${esc(q)}</div>
 <div class="studybox studyhint" onclick="revealHint()" style="cursor:pointer" title="点击显示提示">${showHint?esc(it.hint):'<span class="muted">点击显示提示</span>'}</div>
 <div class="studybox studyanswer" onclick="revealAnswer()" style="cursor:pointer" title="点击显示答案">${showAns?esc(a):'<span class="muted">点击显示答案</span>'}</div>
 <div><div class="progress">${s.index+1} / ${s.queue.length}${s.review?" · 错题回顾":""}${s.reverse?" · 反转模式":""}</div><div class="studybuttons" style="margin-top:10px"><button class="good" onclick="markCorrect()">正确</button><button class="danger" onclick="markWrong()">错误 ✕</button></div></div>
 </div>`
}
function revealHint(){ if(state.study.phase==="q")state.study.phase="h";render() }
function revealAnswer(){ state.study.phase="a";render() }
function markCorrect(){
 const s=state.study,it=s.queue[s.index];
 const today=new Date().toISOString().slice(0,10);
 if(it.lastCorrectDate!==today){it.correctCount++;it.lastCorrectDate=today;save()}
 if(s.review)s.queue.splice(s.index,1); else s.index++;
 if(s.review){if(s.index>=s.queue.length)return finishStudy();}else if(s.index>=s.queue.length)return finishStudy();
 s.phase="q";render()
}
function markWrong(){
 const s=state.study,it=s.queue[s.index];
 if(!s.wrong.includes(it.id))s.wrong.push(it.id);
 s.index++;s.phase="q";
 if(s.index>=s.queue.length){
   if(s.review){
     const remaining=folder().items.filter(x=>s.wrong.includes(x.id));
     if(remaining.length){
       s.queue=remaining;s.index=0;s.phase="q";render();
     }else finishStudy();
   }else finishStudy();
 }else render()
}
function finishStudy(){
 const s=state.study;
 if(!s.review && s.wrong.length){
   showModal(`<h2>本次复习完成</h2><p>本次共 ${s.queue.length} 条，错误 ${s.wrong.length} 条。</p><div class="actions"><button onclick="reviewWrong()">回顾错误</button><button class="secondary" onclick="closeStudy()">结束</button></div>`);
 }else if(s.review){
   showModal(`<h2>错误回顾完成</h2><p>本轮错误内容已经全部答对。</p><button onclick="closeStudy()">结束</button>`)
 }else{
   showModal(`<h2>本次复习完成</h2><p>本轮内容已经全部完成。</p><button onclick="closeStudy()">结束</button>`)
 }
}
function reviewWrong(){
 const s=state.study,items=folder().items.filter(x=>s.wrong.includes(x.id));
 s.queue=items;s.index=0;s.phase="q";s.review=true;closeModal();render()
}
function closeStudy(){closeModal();state.view="folder";state.study=null;render()}
function exportAll(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="抽背备份.json";a.click();URL.revokeObjectURL(url)
}
function importAll(){document.getElementById("importfile").click()}
function doImport(e){
 const file=e.target.files[0];if(!file)return;
